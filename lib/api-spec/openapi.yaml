            - $ref: "#/components/schemas/RaciValue"
            - type: "null"
        expectedValue:
          description: >-
            The cell value the client last saw. When provided and it no longer
            matches the stored value, the update is rejected with 409 so a
            concurrent admin's edit is not silently overwritten.
          oneOf:
            - $ref: "#/components/schemas/RaciValue"
