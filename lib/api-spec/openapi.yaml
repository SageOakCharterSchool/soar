openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sage Oak App Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: terms
  - name: rostering
  - name: raci
  - name: feedback
  - name: settings
  - name: usage
  - name: uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Public auth configuration (which sign-in methods are enabled)
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user account (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/options:
    get:
      operationId: listUserOptions
      tags: [users]
      summary: List users as owner-picker options (any signed-in user)
      responses:
        "200":
          description: User options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserOption"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /terms:
    get:
      operationId: listTerms
      tags: [terms]
      summary: List all terms in chronological order
      responses:
        "200":
          description: Terms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Term"
    post:
      operationId: createTerm
      tags: [terms]
      summary: Add a term (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
  /terms/{id}:
    patch:
      operationId: updateTerm
      tags: [terms]
      summary: Update a term or set it current (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
  /terms/{id}/copy-statuses:
    post:
      operationId: copyTermStatuses
      tags: [terms]
      summary: Pre-populate this term's rostering statuses from another term (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermCopyInput"
      responses:
        "200":
          description: Copied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /rostering/board:
    get:
      operationId: getRosteringBoard
      tags: [rostering]
      summary: Rostering board rows for a term, with feedback counts
      parameters:
        - name: termId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Board rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardRow"
  /rostering/summary:
    get:
      operationId: getRosteringSummary
      tags: [rostering]
      summary: Status bucket counts for a term
      parameters:
        - name: termId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosteringSummary"
  /rostering/status/{id}:
    patch:
      operationId: updateAppTermStatus
      tags: [rostering]
      summary: Edit an app's rostering status row (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppTermStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTermStatus"
  /rostering/activity:
    get:
      operationId: getRosteringActivity
      tags: [rostering]
      summary: Recent activity events (status changes, new apps, issues)
      parameters:
        - name: termId
          in: query
          required: false
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Activity events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /rostering/activity/archive:
    get:
      operationId: getRosteringActivityArchive
      tags: [rostering]
      summary: Archived activity events older than the retention window (admin)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer }
        - name: offset
          in: query
          required: false
          schema: { type: integer }
        - name: search
          in: query
          required: false
          description: Case-insensitive match against app name, actor, or detail
          schema: { type: string }
        - name: appName
          in: query
          required: false
          description: Case-insensitive exact app name filter
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: Only events occurring on/after this date (ISO 8601)
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Only events occurring on/before this date (ISO 8601)
          schema: { type: string }
        - name: archivedBefore
          in: query
          required: false
          description: >
            Snapshot boundary (ISO 8601): only include rows archived at or
            before this instant. Pass the X-Archive-Snapshot header value from
            the first page on subsequent pages to keep paged exports
            consistent while archiving runs.
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: Archived activity events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchivedActivityEvent"
  /rostering/last-seen:
    get:
      operationId: getRosteringLastSeen
      tags: [rostering]
      summary: When the logged-in user last viewed the Rostering page
      responses:
        "200":
          description: Last seen timestamp (null if never visited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosteringLastSeen"
    post:
      operationId: markRosteringSeen
      tags: [rostering]
      summary: Record that the logged-in user just viewed the Rostering page
      responses:
        "200":
          description: Previous last-seen timestamp before this visit (null if first visit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosteringLastSeen"
  /rostering/unseen-count:
    get:
      operationId: getRosteringUnseenCount
      tags: [rostering]
      summary: Number of activity events newer than the user's last Rostering visit
      responses:
        "200":
          description: Count of unseen activity events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosteringUnseenCount"
  /issues/last-seen:
    get:
      operationId: getIssuesLastSeen
      tags: [feedback]
      summary: When the logged-in user last viewed the Issues page
      responses:
        "200":
          description: Last seen timestamp (null if never visited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosteringLastSeen"
    post:
      operationId: markIssuesSeen
      tags: [feedback]
      summary: Record that the logged-in user just viewed the Issues page
      responses:
        "200":
          description: Previous last-seen timestamp before this visit (null if first visit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosteringLastSeen"
  /issues/unseen-count:
    get:
      operationId: getIssuesUnseenCount
      tags: [feedback]
      summary: Number of issue events newer than the user's last Issues visit
      responses:
        "200":
          description: Count of unseen issue events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosteringUnseenCount"
  /apps:
    post:
      operationId: createApp
      tags: [rostering]
      summary: Manually add an application not imported from Clever (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppInput"
      responses:
        "201":
          description: Created application with its status row for the term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApp"
        "400":
          description: Invalid body or inactive sharing status option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Term not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: An application with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /apps/{id}:
    patch:
      operationId: renameApp
      tags: [rostering]
      summary: Rename an application (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameAppInput"
      responses:
        "200":
          description: Renamed application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenamedApp"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Name already used, or app is matched by imports under its current name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteApp
      tags: [rostering]
      summary: Delete an application and its related data (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted application with counts of removed related data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedApp"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /apps/{id}/day-one-critical:
    patch:
      operationId: updateAppDayOneCritical
      tags: [rostering]
      summary: Flag or unflag an app as day-one critical (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayOneCriticalUpdate"
      responses:
        "200":
          description: New flag state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayOneCriticalState"
        "404":
          description: App not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /apps/{id}/upvote:
    post:
      operationId: toggleUpvote
      tags: [feedback]
      summary: Toggle the logged-in user's upvote for an app
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: New upvote state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpvoteState"
  /apps/{id}/issues:
    post:
      operationId: reportIssue
      tags: [feedback]
      summary: Report an issue on an app
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
  /issues:
    get:
      operationId: listIssues
      tags: [feedback]
      summary: List issues across all apps
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, resolved, all]
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
  /issues/{id}:
    patch:
      operationId: updateIssue
      tags: [feedback]
      summary: Resolve or reopen an issue (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
    delete:
      operationId: deleteIssue
      tags: [feedback]
      summary: Delete an issue and its related activity (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /settings:
    get:
      operationId: getAppSettings
      tags: [settings]
      summary: Full application settings (admin only)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateAppSettings
      tags: [settings]
      summary: Update application settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /settings/public:
    get:
      operationId: getPublicAppSettings
      tags: [settings]
      summary: Settings subset needed by all signed-in users
      responses:
        "200":
          description: Public settings subset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppSettings"
  /usage/summary:
    get:
      operationId: getUsageSummary
      tags: [usage]
      summary: Latest snapshot KPI metrics with snapshot date
      responses:
        "200":
          description: KPI summary (nullable fields when no data uploaded yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
  /usage/daily:
    get:
      operationId: getDailyUsage
      tags: [usage]
      summary: Full-history daily student and teacher usage
      parameters:
        - name: startDate
          in: query
          required: false
          schema: { type: string }
        - name: endDate
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Daily rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyUsageRow"
  /usage/by-app:
    get:
      operationId: getUsageByApp
      tags: [usage]
      summary: Latest snapshot app usage rows
      responses:
        "200":
          description: App usage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUsageRow"
  /usage/by-school:
    get:
      operationId: getUsageBySchool
      tags: [usage]
      summary: Latest snapshot per-school usage
      responses:
        "200":
          description: School usage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolUsageRow"
  /usage/mix:
    get:
      operationId: getUsageMix
      tags: [usage]
      summary: Latest snapshot device, browser, and login-method mixes
      responses:
        "200":
          description: Mixes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageMix"
  /usage/applist:
    get:
      operationId: getAppEngagement
      tags: [usage]
      summary: Latest snapshot app engagement detail
      responses:
        "200":
          description: Engagement rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppEngagementRow"
  /usage/additional-resources:
    get:
      operationId: getAdditionalResources
      tags: [usage]
      summary: Latest snapshot other resources accessed
      responses:
        "200":
          description: Resource rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceUsageRow"
  /usage/additional-resources/history:
    get:
      operationId: getAdditionalResourcesHistory
      tags: [usage]
      summary: Per-resource usage across recent snapshot dates
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 60 }
          description: How many recent snapshot dates to include (default 12)
      responses:
        "200":
          description: Usage history per resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceUsageHistory"
  /uploads:
    post:
      operationId: uploadUsageData
      tags: [uploads]
      summary: Upload a batch of Clever export CSVs (admin, multipart form)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadBatch"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /uploads/log:
    get:
      operationId: getImportLog
      tags: [uploads]
      summary: Audit log of past uploads (admin)
      responses:
        "200":
          description: Import log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportLogEntry"
  /uploads/sftp/status:
    get:
      operationId: getSftpSyncStatus
      tags: [uploads]
      summary: Status of the automatic Clever SFTP report sync (admin)
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SftpSyncStatus"
  /uploads/sftp/sync:
    post:
      operationId: triggerSftpSync
      tags: [uploads]
      summary: Trigger an immediate Clever SFTP report sync (admin)
      responses:
        "200":
          description: Sync summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SftpSyncSummary"
        "400":
          description: SFTP not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: A sync is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /uploads/sftp/alerts:
    get:
      operationId: getSyncAlerts
      tags: [uploads]
      summary: Active alerts from failed Clever SFTP syncs (admin)
      responses:
        "200":
          description: Active sync alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncAlert"
  /uploads/sftp/alerts/{id}/dismiss:
    post:
      operationId: dismissSyncAlert
      tags: [uploads]
      summary: Dismiss a sync failure alert (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Alert not found or already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /raci:
    get:
      operationId: getRaciMatrix
      tags: [raci]
      summary: Full RACI matrix (all teams, members, rows, and assignments)
      responses:
        "200":
          description: RACI matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaciMatrix"
  /raci/app-options:
    get:
      operationId: listRaciAppOptions
      tags: [raci]
      summary: Applications available for linking to RACI rows
      responses:
        "200":
          description: Application options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RaciAppOption"
  /raci/rows:
    post:
      operationId: createRaciRow
      tags: [raci]
      summary: Add a RACI row (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaciRowInput"
      responses:
        "200":
          description: Created row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaciRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /raci/rows/{id}:
    patch:
      operationId: updateRaciRow
      tags: [raci]
      summary: Rename, recategorize, or (un)link a RACI row (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaciRowUpdate"
      responses:
        "200":
          description: Updated row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaciRow"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: The row name was changed by another admin since it was loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaciNameConflict"
    delete:
      operationId: deleteRaciRow
      tags: [raci]
      summary: Remove a RACI row (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: expectedName
          in: query
          required: false
          description: >-
            The row name the client last saw. When provided and it no longer
            matches the stored name, the delete is rejected with 409 so a
            concurrent admin's rename is not silently destroyed.
          schema:
            type: string
        - name: expectedAssignments
          in: query
          required: false
          description: >-
            Canonical fingerprint of the row's cell assignments the client
            last saw: "memberId=value" pairs sorted by memberId and joined
            with commas (empty string when the row had no assignments). When
            provided and it no longer matches the stored assignments, the
            delete is rejected with 409 so a concurrent admin's assignment
            changes are not silently destroyed.
          schema:
            type: string
      responses:
        "200":
          description: Row removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: >-
            The row's name or assignments were changed by another admin since
            it was loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaciNameConflict"
