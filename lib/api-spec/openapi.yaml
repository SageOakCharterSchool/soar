      properties:
        school: { type: string }
        uniqueUsers: { type: integer }
        scopedUsers: { type: integer }
        adoptionPct: { type: number }
    MixSlice:
      type: object
      required: [label, uniqueUsers]
      properties:
        label: { type: string }
        uniqueUsers: { type: integer }
    UsageMix:
      type: object
      required: [devices, browsers, loginMethods]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/MixSlice"
        browsers:
          type: array
          items:
            $ref: "#/components/schemas/MixSlice"
        loginMethods:
          type: array
          items:
            $ref: "#/components/schemas/MixSlice"
    AppEngagementRow:
      type: object
      required: [appName, studentCount, studentPercent, teacherCount, teacherPercent, activeTimePerUserMinutes]
      properties:
        appName: { type: string }
        studentCount: { type: integer }
        studentPercent: { type: number }
        teacherCount: { type: integer }
        teacherPercent: { type: number }
        activeTimePerUserMinutes: { type: number, nullable: true }
    ResourceUsageRow:
      type: object
      required: [link, uniqueUsers, totalAccesses]
      properties:
        link: { type: string }
        uniqueUsers: { type: integer }
        totalAccesses: { type: integer }
    ResourceUsagePoint:
      type: object
      required: [snapshotDate, uniqueUsers, totalAccesses]
      properties:
        snapshotDate: { type: string }
        uniqueUsers: { type: integer }
        totalAccesses: { type: integer }
    ResourceUsageSeries:
      type: object
      required: [link, points]
      properties:
        link: { type: string }
        points:
          type: array
          items:
            $ref: "#/components/schemas/ResourceUsagePoint"
    ResourceUsageHistory:
      type: object
      required: [snapshotDates, resources]
      properties:
        snapshotDates:
          type: array
          items: { type: string }
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceUsageSeries"
    UploadFile:
      type: object
      required: [name, content]
      properties:
        name: { type: string }
        content: { type: string }
    UploadBatch:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/UploadFile"
    ImportResult:
      type: object
      required: [snapshotDate, filesProcessed, rowsInserted, rowsUpdated, warnings]
      properties:
        snapshotDate: { type: string }
        filesProcessed:
          type: array
          items: { type: string }
        rowsInserted: { type: integer }
        rowsUpdated: { type: integer }
        warnings:
          type: array
          items: { type: string }
    ImportLogEntry:
      type: object
      required: [id, uploadedAt, uploadedByName, snapshotDate, filesIncluded, source, rowsInserted, rowsUpdated]
      properties:
        id: { type: integer }
        uploadedAt: { type: string }
        uploadedByName: { type: string }
        snapshotDate: { type: string }
        filesIncluded:
          type: array
          items: { type: string }
        source: { type: string, enum: [upload, sftp] }
        rowsInserted: { type: integer }
        rowsUpdated: { type: integer }
    SftpSyncSummary:
      type: object
      required: [importedSnapshots, skippedSnapshots, warnings]
      properties:
        importedSnapshots:
          type: array
          items: { type: string }
        skippedSnapshots:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
    SftpSyncRun:
      type: object
      required: [id, ranAt, ok, importedSnapshots, skippedSnapshots, warnings, error]
      properties:
        id: { type: integer }
        ranAt: { type: string }
        ok: { type: boolean }
        importedSnapshots:
          type: array
          items: { type: string }
        skippedSnapshots:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        error:
          type: [string, "null"]
    SftpSyncStatus:
      type: object
      required:
        [
          configured,
          running,
          lastRunAt,
          lastResult,
          lastError,
          recentRuns,
          scheduleEnabled,
          scheduleTime,
          nextRunAt,
        ]
      properties:
        configured: { type: boolean }
        running: { type: boolean }
        scheduleEnabled: { type: boolean }
        scheduleTime: { type: string }
        nextRunAt:
          type: [string, "null"]
        lastRunAt:
          type: [string, "null"]
        lastResult:
          oneOf:
            - $ref: "#/components/schemas/SftpSyncSummary"
            - type: "null"
        lastError:
          type: [string, "null"]
        recentRuns:
          type: array
          items:
            $ref: "#/components/schemas/SftpSyncRun"
    SyncAlert:
      type: object
      required: [id, message, occurrences, firstSeenAt, lastSeenAt]
      properties:
        id: { type: integer }
        message: { type: string }
        occurrences: { type: integer }
        firstSeenAt: { type: string }
        lastSeenAt: { type: string }
