components:
  schemas:
    DropdownOption:
      type: object
      required: [value, label, active]
      properties:
        value: { type: string }
        label: { type: string }
        active: { type: boolean }
    SyncScheduleSettings:
      type: object
      required: [enabled, time]
      properties:
        enabled: { type: boolean }
        time:
          type: string
          description: Time of day (server time) in HH:MM 24-hour format.
    BrandingSettings:
      type: object
      required: [appName, logoDataUrl, accentColor]
      properties:
        appName: { type: string }
        logoDataUrl:
          type: ["string", "null"]
        accentColor:
          type: ["string", "null"]
          description: Hex color like "#4a7c67", or null for the default theme.
    NotificationSettings:
      type: object
      required: [syncFailureBannerEnabled, alertOnSyncWarnings, recipients]
      properties:
        syncFailureBannerEnabled: { type: boolean }
        alertOnSyncWarnings: { type: boolean }
        recipients:
          type: array
          items: { type: string }
    AppSettings:
      type: object
      required:
        [
          staleOpenDays,
          sharingStatusOptions,
          raciValueOptions,
          syncSchedule,
          branding,
          notifications,
        ]
      properties:
        staleOpenDays:
          type: integer
          minimum: 1
          maximum: 365
        sharingStatusOptions:
          type: array
          items:
            $ref: "#/components/schemas/DropdownOption"
        raciValueOptions:
          type: array
          items:
            $ref: "#/components/schemas/DropdownOption"
        syncSchedule:
          $ref: "#/components/schemas/SyncScheduleSettings"
        branding:
          $ref: "#/components/schemas/BrandingSettings"
        notifications:
          $ref: "#/components/schemas/NotificationSettings"
    PublicAppSettings:
      type: object
      required:
        [
          staleOpenDays,
          sharingStatusOptions,
          raciValueOptions,
          branding,
          syncFailureBannerEnabled,
        ]
      properties:
        staleOpenDays:
          type: integer
          minimum: 1
          maximum: 365
        sharingStatusOptions:
          type: array
          items:
            $ref: "#/components/schemas/DropdownOption"
        raciValueOptions:
          type: array
          items:
            $ref: "#/components/schemas/DropdownOption"
        branding:
          $ref: "#/components/schemas/BrandingSettings"
        syncFailureBannerEnabled: { type: boolean }
    AppSettingsUpdate:
      type: object
      properties:
        staleOpenDays:
          type: integer
          minimum: 1
          maximum: 365
        sharingStatusOptions:
          type: array
          items:
            $ref: "#/components/schemas/DropdownOption"
