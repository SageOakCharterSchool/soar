openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sage Oak App Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: terms
  - name: rostering
  - name: feedback
  - name: usage
  - name: uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Public auth configuration (which sign-in methods are enabled)
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user account (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/options:
    get:
      operationId: listUserOptions
      tags: [users]
      summary: List users as owner-picker options (any signed-in user)
      responses:
        "200":
          description: User options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserOption"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /terms:
    get:
      operationId: listTerms
      tags: [terms]
      summary: List all terms in chronological order
      responses:
        "200":
          description: Terms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Term"
    post:
      operationId: createTerm
      tags: [terms]
      summary: Add a term (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
  /terms/{id}:
    patch:
      operationId: updateTerm
      tags: [terms]
      summary: Update a term or set it current (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
  /terms/{id}/copy-statuses:
    post:
      operationId: copyTermStatuses
      tags: [terms]
      summary: Pre-populate this term's rostering statuses from another term (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermCopyInput"
      responses:
        "200":
          description: Copied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /rostering/board:
    get:
      operationId: getRosteringBoard
      tags: [rostering]
      summary: Rostering board rows for a term, with feedback counts
      parameters:
        - name: termId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Board rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardRow"
  /rostering/summary:
    get:
      operationId: getRosteringSummary
      tags: [rostering]
      summary: Status bucket counts for a term
      parameters:
        - name: termId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosteringSummary"
  /rostering/status/{id}:
    patch:
      operationId: updateAppTermStatus
      tags: [rostering]
      summary: Edit an app's rostering status row (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppTermStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTermStatus"
  /rostering/activity:
    get:
      operationId: getRosteringActivity
      tags: [rostering]
      summary: Recent activity events (status changes, new apps, issues)
      parameters:
        - name: termId
          in: query
          required: false
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Activity events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /rostering/activity/archive:
    get:
      operationId: getRosteringActivityArchive
      tags: [rostering]
      summary: Archived activity events older than the retention window (admin)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer }
        - name: offset
          in: query
          required: false
          schema: { type: integer }
        - name: search
          in: query
          required: false
          description: Case-insensitive match against app name, actor, or detail
          schema: { type: string }
        - name: appName
          in: query
          required: false
          description: Case-insensitive exact app name filter
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: Only events occurring on/after this date (ISO 8601)
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Only events occurring on/before this date (ISO 8601)
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: Archived activity events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchivedActivityEvent"
  /rostering/last-seen:
    get:
      operationId: getRosteringLastSeen
      tags: [rostering]
      summary: When the logged-in user last viewed the Rostering page
      responses:
        "200":
          description: Last seen timestamp (null if never visited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosteringLastSeen"
    post:
      operationId: markRosteringSeen
      tags: [rostering]
      summary: Record that the logged-in user just viewed the Rostering page
      responses:
        "200":
          description: Previous last-seen timestamp before this visit (null if first visit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosteringLastSeen"
  /rostering/unseen-count:
    get:
      operationId: getRosteringUnseenCount
      tags: [rostering]
      summary: Number of activity events newer than the user's last Rostering visit
      responses:
        "200":
          description: Count of unseen activity events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosteringUnseenCount"
  /apps/{id}/upvote:
    post:
      operationId: toggleUpvote
      tags: [feedback]
      summary: Toggle the logged-in user's upvote for an app
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: New upvote state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpvoteState"
  /apps/{id}/issues:
    post:
      operationId: reportIssue
      tags: [feedback]
      summary: Report an issue on an app
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
  /issues:
    get:
      operationId: listIssues
      tags: [feedback]
      summary: List issues across all apps
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, resolved, all]
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
  /issues/{id}:
    patch:
      operationId: updateIssue
      tags: [feedback]
      summary: Resolve or reopen an issue (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
  /usage/summary:
    get:
      operationId: getUsageSummary
      tags: [usage]
      summary: Latest snapshot KPI metrics with snapshot date
      responses:
        "200":
          description: KPI summary (nullable fields when no data uploaded yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
  /usage/daily:
    get:
      operationId: getDailyUsage
      tags: [usage]
      summary: Full-history daily student and teacher usage
      parameters:
        - name: startDate
          in: query
          required: false
          schema: { type: string }
        - name: endDate
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Daily rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyUsageRow"
  /usage/by-app:
    get:
      operationId: getUsageByApp
      tags: [usage]
      summary: Latest snapshot app usage rows
      responses:
        "200":
          description: App usage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppUsageRow"
  /usage/by-school:
    get:
      operationId: getUsageBySchool
      tags: [usage]
      summary: Latest snapshot per-school usage
      responses:
        "200":
          description: School usage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolUsageRow"
  /usage/mix:
    get:
      operationId: getUsageMix
      tags: [usage]
      summary: Latest snapshot device, browser, and login-method mixes
      responses:
        "200":
          description: Mixes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageMix"
  /usage/applist:
    get:
      operationId: getAppEngagement
      tags: [usage]
      summary: Latest snapshot app engagement detail
      responses:
        "200":
          description: Engagement rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppEngagementRow"
  /usage/additional-resources:
    get:
      operationId: getAdditionalResources
      tags: [usage]
      summary: Latest snapshot other resources accessed
      responses:
        "200":
          description: Resource rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceUsageRow"
  /uploads:
    post:
      operationId: uploadUsageData
      tags: [uploads]
      summary: Upload a batch of Clever export CSVs (admin, multipart form)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadBatch"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /uploads/log:
    get:
      operationId: getImportLog
      tags: [uploads]
      summary: Audit log of past uploads (admin)
      responses:
        "200":
          description: Import log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportLogEntry"
  /uploads/sftp/status:
    get:
      operationId: getSftpSyncStatus
      tags: [uploads]
      summary: Status of the automatic Clever SFTP report sync (admin)
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SftpSyncStatus"
  /uploads/sftp/sync:
    post:
      operationId: triggerSftpSync
      tags: [uploads]
      summary: Trigger an immediate Clever SFTP report sync (admin)
      responses:
        "200":
          description: Sync summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SftpSyncSummary"
        "400":
          description: SFTP not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: A sync is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /uploads/sftp/alerts:
    get:
      operationId: getSyncAlerts
      tags: [uploads]
      summary: Active alerts from failed Clever SFTP syncs (admin)
      responses:
        "200":
          description: Active sync alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncAlert"
  /uploads/sftp/alerts/{id}/dismiss:
    post:
      operationId: dismissSyncAlert
      tags: [uploads]
      summary: Dismiss a sync failure alert (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Alert not found or already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ApiMessage:
      type: object
      properties:
        message: { type: string }
      required: [message]
    AuthConfig:
      type: object
      required: [googleEnabled]
      properties:
        googleEnabled: { type: boolean }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    User:
      type: object
      required: [id, email, displayName, role, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [admin, staff]
        createdAt: { type: string }
    UserOption:
      type: object
      required: [id, displayName, role]
      properties:
        id: { type: integer }
        displayName: { type: string }
        role:
          type: string
          enum: [admin, staff]
    UserInput:
      type: object
      required: [email, password, displayName, role]
      properties:
        email: { type: string }
        password: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [admin, staff]
    UserUpdate:
      type: object
      properties:
        displayName: { type: string }
        role:
          type: string
          enum: [admin, staff]
        password: { type: string }
    Term:
      type: object
      required: [id, label, schoolYear, termType, startDate, endDate, sortOrder, isCurrent]
      properties:
        id: { type: integer }
        label: { type: string }
        schoolYear: { type: string }
        termType:
          type: string
          enum: [regular, summer]
        startDate: { type: string }
        endDate: { type: string }
        sortOrder: { type: integer }
        isCurrent: { type: boolean }
    TermInput:
      type: object
      required: [label, schoolYear, termType, startDate, endDate, sortOrder]
      properties:
        label: { type: string }
        schoolYear: { type: string }
        termType:
          type: string
          enum: [regular, summer]
        startDate: { type: string }
        endDate: { type: string }
        sortOrder: { type: integer }
        isCurrent: { type: boolean }
    TermUpdate:
      type: object
      properties:
        label: { type: string }
        schoolYear: { type: string }
        termType:
          type: string
          enum: [regular, summer]
        startDate: { type: string }
        endDate: { type: string }
        sortOrder: { type: integer }
        isCurrent: { type: boolean }
    TermCopyInput:
      type: object
      required: [sourceTermId]
      properties:
        sourceTermId: { type: integer }
    AppTermStatus:
      type: object
      required: [id, applicationId, termId, studentSharingStatus, staffSharingStatus, updatedAt]
      properties:
        id: { type: integer }
        applicationId: { type: integer }
        termId: { type: integer }
        studentSharingStatus:
          type: string
          enum: [not_started, in_progress, complete, needs_review]
        staffSharingStatus:
          type: string
          enum: [not_started, in_progress, complete, needs_review]
        syncMethod:
          type: ["string", "null"]
        lastSyncedAt:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        updatedAt: { type: string }
        updatedByName:
          type: ["string", "null"]
    AppTermStatusUpdate:
      type: object
      properties:
        studentSharingStatus:
          type: string
          enum: [not_started, in_progress, complete, needs_review]
        staffSharingStatus:
          type: string
          enum: [not_started, in_progress, complete, needs_review]
        syncMethod:
          type: ["string", "null"]
          enum: [SSO, SAML, manual, other, null]
        lastSyncedAt:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
    BoardRow:
      type: object
      required: [applicationId, appName, statusId, studentSharingStatus, staffSharingStatus, upvoteCount, upvotedByMe, openIssueCount]
      properties:
        applicationId: { type: integer }
        appName: { type: string }
        category:
          type: ["string", "null"]
        statusId: { type: integer }
        studentSharingStatus:
          type: string
          enum: [not_started, in_progress, complete, needs_review]
        staffSharingStatus:
          type: string
          enum: [not_started, in_progress, complete, needs_review]
        syncMethod:
          type: ["string", "null"]
        lastSyncedAt:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
        updatedByName:
          type: ["string", "null"]
        upvoteCount: { type: integer }
        upvotedByMe: { type: boolean }
        openIssueCount: { type: integer }
    RosteringSummary:
      type: object
      required: [notStarted, inProgress, complete, needsReview, total]
      properties:
        notStarted: { type: integer }
        inProgress: { type: integer }
        complete: { type: integer }
        needsReview: { type: integer }
        total: { type: integer }
    ActivityEvent:
      type: object
      required: [id, applicationId, appName, eventType, detail, createdAt]
      properties:
        id: { type: integer }
        applicationId: { type: integer }
        appName: { type: string }
        termId:
          type: ["integer", "null"]
        eventType:
          type: string
          enum: [status_change, app_added, issue_reported, issue_resolved]
        detail: { type: string }
        actorName:
          type: ["string", "null"]
        createdAt: { type: string }
    ArchivedActivityEvent:
      type: object
      required: [id, applicationId, appName, eventType, detail, createdAt, archivedAt]
      properties:
        id: { type: integer }
        applicationId: { type: integer }
        appName: { type: string }
        termId:
          type: ["integer", "null"]
        eventType: { type: string }
        detail: { type: string }
        actorName:
          type: ["string", "null"]
        createdAt: { type: string }
        archivedAt: { type: string }
    RosteringLastSeen:
      type: object
      required: [lastSeenAt]
      properties:
        lastSeenAt:
          type: ["string", "null"]
    RosteringUnseenCount:
      type: object
      required: [count]
      properties:
        count: { type: integer }
    UpvoteState:
      type: object
      required: [applicationId, upvoted, upvoteCount]
      properties:
        applicationId: { type: integer }
        upvoted: { type: boolean }
        upvoteCount: { type: integer }
    IssueInput:
      type: object
      required: [comment]
      properties:
        comment: { type: string, minLength: 1 }
    Issue:
      type: object
      required: [id, applicationId, appName, userId, reporterName, comment, status, createdAt]
      properties:
        id: { type: integer }
        applicationId: { type: integer }
        appName: { type: string }
        userId: { type: integer }
        reporterName: { type: string }
        comment: { type: string }
        status:
          type: string
          enum: [open, resolved]
        createdAt: { type: string }
    IssueUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, resolved]
    UsageSummary:
      type: object
      required: [hasData]
      properties:
        hasData: { type: boolean }
        snapshotDate:
          type: ["string", "null"]
        timeRange:
          type: ["string", "null"]
        uniqueStudents:
          type: ["integer", "null"]
        scopedStudents:
